name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commit-messages:
    name: Commit Message Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install pinned Commitlint dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Self-test commit message contract
        run: bash scripts/test-commitlint.sh

      - name: Self-test commit range topology
        run: bash scripts/test-commit-range.sh

      - name: Validate commit range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || '' }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          REPOSITORY: ${{ github.repository }}
        run: bash scripts/validate_commit_range.sh

  changelog:
    name: Changelog Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen --all-extras --python 3.11

      - name: Self-test Towncrier rendering contract
        run: bash scripts/test-changelog-governance.sh

      - name: Self-test release changelog contract
        run: uv run python scripts/validate_release_changelog.py --self-test

      - name: Validate committed changelog structure
        run: uv run python scripts/validate_release_changelog.py

      - name: Validate changelog single-writer ownership
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          uv run python -m scripts.validate_changelog_ownership \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --pr-title "$PR_TITLE" \
            --pr-author "$PR_AUTHOR" \
            --head-branch "$HEAD_BRANCH" \
            --head-repository "$HEAD_REPOSITORY" \
            --repository "$REPOSITORY"

      - name: Require Towncrier change evidence for non-Release Please pull request
        if: >-
          github.event_name == 'pull_request' &&
          !(
            github.event.pull_request.user.login == 'github-actions[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.head.ref ==
              'release-please--branches--main--components--JameFirewall'
          )
        run: uv run towncrier check --compare-with "origin/${{ github.base_ref }}"

      - name: Require consolidated changelog for Release Please
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'github-actions[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref ==
            'release-please--branches--main--components--JameFirewall'
        run: uv run python scripts/validate_release_changelog.py --require-clean-fragments

  quality:
    name: Linux Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen --all-extras --python 3.11

      - name: Validate GitHub Actions workflows with actionlint
        run: uv run pre-commit run actionlint --all-files

      - name: Validate pull request description contract
        run: uv run python scripts/validate_pr_description.py --self-test

      - name: Validate current pull request description
        if: >-
          github.event_name == 'pull_request' &&
          !(
            github.event.pull_request.user.login == 'github-actions[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.head.ref ==
              'release-please--branches--main--components--JameFirewall'
          )
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pull-request.md"
          uv run python scripts/validate_pr_description.py --body-file "$RUNNER_TEMP/pull-request.md"

      - name: Validate formatting and lint
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts

      - name: Validate strict typing
        run: uv run mypy src tests scripts

      - name: Run portable pytest suite
        run: |
          mkdir -p artifacts
          uv run pytest -m "not windows_only" --cov=src/jame_firewall --cov-branch --junitxml=artifacts/pytest-linux.xml

      - name: Upload Linux test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytest-linux-results
          path: artifacts/pytest-linux.xml
          if-no-files-found: error
  windows-system:
    name: Windows System Acceptance
    runs-on: windows-2025
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen --all-extras --python 3.11

      - name: Run native Windows pytest contracts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          uv run pytest -m "windows_only and not windows_system" --junitxml=artifacts/pytest-windows.xml -v

      - name: Install pinned 7-Zip system fixture
        shell: pwsh
        run: |
          choco install 7zip.install --version=26.3.0 --yes --no-progress --force --allow-downgrade
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
          if (-not (Test-Path -LiteralPath $sevenZip)) {
            throw "Pinned 7-Zip fixture was not installed at $sevenZip"
          }
          $productVersion = (Get-Item -LiteralPath $sevenZip).VersionInfo.ProductVersion
          if (-not $productVersion.StartsWith("26.03")) {
            throw "Unexpected 7-Zip product version: $productVersion"
          }

      - name: Run 7-Zip firewall system E2E
        shell: pwsh
        run: |
          uv run pytest -m windows_system --junitxml=artifacts/pytest-windows-system.xml -v

      - name: Upload Windows system evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-system-evidence
          path: |
            artifacts/pytest-windows.xml
            artifacts/pytest-windows-system.xml
          if-no-files-found: warn

  windows-package:
    name: Windows Packaged Runtime
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen --all-extras --python 3.11

      - name: Build production Windows executable
        run: uv run pyinstaller --clean --noconfirm JameFirewall.spec

      - name: Install pinned Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Repository PSGallery -Scope CurrentUser -Force -AllowClobber
          Import-Module Pester -RequiredVersion 5.7.1
          if ((Get-Module Pester).Version.ToString() -ne "5.7.1") {
            throw "Unexpected Pester version"
          }

      - name: Run packaged executable contract with Pester
        shell: pwsh
        env:
          JAMEFIREWALL_EXE: ${{ github.workspace }}\dist\JameFirewall.exe
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Import-Module Pester -RequiredVersion 5.7.1
          $config = New-PesterConfiguration
          $config.Run.Path = "tests/windows/runtime"
          $config.Run.Exit = $true
          $config.Output.Verbosity = "Detailed"
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = "NUnitXml"
          $config.TestResult.OutputPath = "artifacts/pester-windows.xml"
          Invoke-Pester -Configuration $config

      - name: Upload Windows package evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-package-evidence
          path: |
            artifacts/pester-windows.xml
            dist/JameFirewall.exe
            crash_log.txt
          if-no-files-found: warn

  required-ci:
    name: Required CI
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - commit-messages
      - changelog
      - quality
      - windows-system
      - windows-package

    steps:
      - name: Require commit, changelog, Linux, Windows system, and packaged runtime contracts
        env:
          COMMIT_MESSAGES_RESULT: ${{ needs.commit-messages.result }}
          CHANGELOG_RESULT: ${{ needs.changelog.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          WINDOWS_SYSTEM_RESULT: ${{ needs.windows-system.result }}
          WINDOWS_PACKAGE_RESULT: ${{ needs.windows-package.result }}
        run: |
          test "$COMMIT_MESSAGES_RESULT" = "success"
          test "$CHANGELOG_RESULT" = "success"
          test "$QUALITY_RESULT" = "success"
          test "$WINDOWS_SYSTEM_RESULT" = "success"
          test "$WINDOWS_PACKAGE_RESULT" = "success"
