name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Linux Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen --all-extras --python 3.11

      - name: Validate formatting and lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Validate strict typing
        run: uv run mypy src tests

      - name: Run portable pytest suite
        run: |
          mkdir -p artifacts
          uv run pytest -m "not windows_only" --cov=src/jame_firewall --cov-branch --junitxml=artifacts/pytest-linux.xml

      - name: Upload Linux test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytest-linux-results
          path: artifacts/pytest-linux.xml
          if-no-files-found: error
  windows-native:
    name: Windows Native Runtime
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen --all-extras --python 3.11

      - name: Run native Windows pytest contracts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          uv run pytest -m windows_only --junitxml=artifacts/pytest-windows.xml -v
      - name: Build production Windows executable
        run: uv run pyinstaller --clean --noconfirm JameFirewall.spec

      - name: Install pinned Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          Import-Module Pester -RequiredVersion 5.7.1
          if ((Get-Module Pester).Version.ToString() -ne "5.7.1") {
            throw "Unexpected Pester version"
          }

      - name: Run packaged executable contract with Pester
        shell: pwsh
        env:
          JAMEFIREWALL_EXE: ${{ github.workspace }}\dist\JameFirewall.exe
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $config = New-PesterConfiguration
          $config.Run.Path = "tests/windows/runtime"
          $config.Run.Exit = $true
          $config.Output.Verbosity = "Detailed"
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = "NUnitXml"
          $config.TestResult.OutputPath = "artifacts/pester-windows.xml"
          Invoke-Pester -Configuration $config

      - name: Upload Windows runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-native-runtime-evidence
          path: |
            artifacts/pytest-windows.xml
            artifacts/pester-windows.xml
            dist/JameFirewall.exe
            crash_log.txt
          if-no-files-found: warn

  required-ci:
    name: Required CI
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - quality
      - windows-native

    steps:
      - name: Require Linux and Windows contracts
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          WINDOWS_RESULT: ${{ needs.windows-native.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$WINDOWS_RESULT" = "success"
