name: Pull Request Governance

on:
  pull_request_target:
    branches:
      - main
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    name: PR Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Require agent branch from this repository
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; then
            echo "Only same-repository agent branches are eligible for merge." >&2
            exit 1
          fi

      - name: Checkout trusted base revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Sync trusted governance dependencies
        run: uv sync --frozen --all-extras --python 3.11
      - name: Set up Node.js 24 for Release Please body validation
        if: >-
          github.event.pull_request.user.login == 'jamefirewall-release-roymejia2217[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref ==
            'release-please--branches--main--components--JameFirewall'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install pinned Release Please parser
        if: >-
          github.event.pull_request.user.login == 'jamefirewall-release-roymejia2217[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref ==
            'release-please--branches--main--components--JameFirewall'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate standard Conventional Commits pull request title
        if: >-
          !(
            github.event.pull_request.user.login == 'jamefirewall-release-roymejia2217[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.head.ref ==
              'release-please--branches--main--components--JameFirewall'
          )
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            style
            test
            build
            ci
            chore
            revert
          scopes: |
            core
            firewall
            os
            persistence
            ui
            packaging
            ci
            deps
            governance
            release
          requireScope: true

      - name: Validate Release Please pull request title
        if: >-
          github.event.pull_request.user.login == 'jamefirewall-release-roymejia2217[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref ==
            'release-please--branches--main--components--JameFirewall'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            chore
          scopes: |
            main
          requireScope: true
          subjectPattern: '^release [0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$'
          subjectPatternError: 'Release Please title must be chore(main): release <SemVer>.'

      - name: Validate standard pull request description
        if: >-
          !(
            github.event.pull_request.user.login == 'jamefirewall-release-roymejia2217[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.head.ref ==
              'release-please--branches--main--components--JameFirewall'
          )
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pull-request.md"
          uv run python scripts/validate_pr_description.py --body-file "$RUNNER_TEMP/pull-request.md"

      - name: Validate Release Please pull request body
        if: >-
          github.event.pull_request.user.login == 'jamefirewall-release-roymejia2217[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref ==
            'release-please--branches--main--components--JameFirewall'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/release-please-body.md"
          node scripts/validate_release_please_pr.cjs \
            --body-file "$RUNNER_TEMP/release-please-body.md" \
            --title "$PR_TITLE"
