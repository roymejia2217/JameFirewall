name: Pull Request Governance

on:
  pull_request_target:
    branches:
      - main
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    name: PR Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Require agent branch from this repository
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; then
            echo "Only same-repository agent branches are eligible for merge." >&2
            exit 1
          fi

      - name: Checkout trusted base revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Sync trusted governance dependencies
        run: uv sync --frozen --all-extras --python 3.11

      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run cz check --message "$PR_TITLE"

      - name: Validate pull request description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pull-request.md"
          uv run python scripts/validate_pr_description.py --body-file "$RUNNER_TEMP/pull-request.md"
