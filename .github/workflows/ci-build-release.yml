name: JameFirewall CI/CD & Automated Release Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # ==========================================================
  # 1. QUALITY GATE & HARNESS (Cross-Platform)
  # ==========================================================
  quality-gate:
    name: Quality Gate & Test Harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Pin and Install Python 3.11
        run: uv python install 3.11

      - name: Sync Dependencies
        run: uv sync --all-extras

      - name: Verify Ruff Linters & Formatting
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Verify Mypy Strict Mode
        run: uv run mypy src tests

      - name: Run Test Suite with Coverage
        run: uv run pytest --cov=src/jame_firewall --cov-branch

  # ==========================================================
  # 2. MOTOR DE RELEASE (Google Release-Please v4)
  # ==========================================================
  release-please:
    name: Orchestrate Semantic Release
    needs: quality-gate
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run Release-Please Engine
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================
  # 3. COMPILACIÓN NATIVA WINDOWS Y DISTRIBUCIÓN
  # ==========================================================
  build-and-publish-windows:
    name: Native Windows Build & Asset Delivery
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup uv on Windows
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Pin and Install Python 3.11
        run: uv python install 3.11

      - name: Sync Build Dependencies
        run: uv sync --all-extras

      - name: Determinar Nombre Canónico del Artefacto
        shell: pwsh
        run: |
          $ver = "${{ needs.release-please.outputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $ver = uv run python -c "import jame_firewall; print(jame_firewall.__version__)"
          }
          $artifactName = "JameFirewall-v$ver-windows-x64.exe"
          echo "CANONICAL_NAME=$artifactName" >> $env:GITHUB_ENV
          Write-Host "Compilando artefacto canónico: $artifactName"

      - name: Compilar con PyInstaller
        run: uv run pyinstaller JameFirewall.spec

      - name: Renombrar y Generar Checksum GNU Coreutils
        shell: pwsh
        run: |
          Move-Item -Path "dist/JameFirewall.exe" -Destination "dist/${{ env.CANONICAL_NAME }}"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/${{ env.CANONICAL_NAME }}").Hash.ToLower()
          "$hash  ${{ env.CANONICAL_NAME }}" | Out-File -FilePath "dist/${{ env.CANONICAL_NAME }}.sha256" -Encoding ascii
          Write-Host "SHA256 ($($env:CANONICAL_NAME)): $hash"

      - name: Subir Assets a la Release Existente
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ needs.release-please.outputs.tag_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "v" + (uv run python -c "import jame_firewall; print(jame_firewall.__version__)")
          }
          gh release upload $tag "dist/${{ env.CANONICAL_NAME }}" "dist/${{ env.CANONICAL_NAME }}.sha256" --clobber
