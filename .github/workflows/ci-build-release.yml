name: JameFirewall CI/CD & Automated Release Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Release Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen --all-extras --python 3.11

      - name: Validate GitHub Actions workflows with actionlint
        run: uv run pre-commit run actionlint --all-files

      - name: Validate governance contract
        run: uv run python scripts/validate_pr_description.py --self-test

      - name: Validate formatting and lint
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts

      - name: Validate strict typing
        run: uv run mypy src tests scripts

      - name: Run portable pytest suite
        run: uv run pytest -m "not windows_only" --cov=src/jame_firewall --cov-branch

  windows-release-preflight:
    name: Windows Release Preflight
    needs: quality-gate
    runs-on: windows-2025
    timeout-minutes: 40
    outputs:
      candidate_sha256: ${{ steps.candidate-hash.outputs.sha256 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen --all-extras --python 3.11

      - name: Run native Windows contracts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          uv run pytest -m "windows_only and not windows_system" --junitxml=artifacts/pytest-windows.xml -v

      - name: Install pinned 7-Zip system fixture
        shell: pwsh
        run: |
          choco install 7zip.install --version=26.3.0 --yes --no-progress --force --allow-downgrade
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
          if (-not (Test-Path -LiteralPath $sevenZip)) {
            throw "Pinned 7-Zip fixture was not installed at $sevenZip"
          }
          $productVersion = (Get-Item -LiteralPath $sevenZip).VersionInfo.ProductVersion
          if (-not $productVersion.StartsWith("26.03")) {
            throw "Unexpected 7-Zip product version: $productVersion"
          }

      - name: Run 7-Zip firewall system E2E
        shell: pwsh
        run: uv run pytest -m windows_system --junitxml=artifacts/pytest-windows-system.xml -v

      - name: Build production Windows executable
        run: uv run pyinstaller --clean --noconfirm JameFirewall.spec

      - name: Install pinned Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Repository PSGallery -Scope CurrentUser -Force -AllowClobber
          Import-Module Pester -RequiredVersion 5.7.1
          if ((Get-Module Pester).Version.ToString() -ne "5.7.1") {
            throw "Unexpected Pester version"
          }

      - name: Validate packaged executable with Pester
        shell: pwsh
        env:
          JAMEFIREWALL_EXE: ${{ github.workspace }}\dist\JameFirewall.exe
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $config = New-PesterConfiguration
          $config.Run.Path = "tests/windows/runtime"
          $config.Run.Exit = $true
          $config.Output.Verbosity = "Detailed"
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = "NUnitXml"
          $config.TestResult.OutputPath = "artifacts/pester-windows.xml"
          Invoke-Pester -Configuration $config

      - name: Record candidate SHA-256
        id: candidate-hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "dist/JameFirewall.exe").Hash.ToLower()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "$hash  JameFirewall.exe" | Out-File -FilePath "dist/JameFirewall.exe.sha256" -Encoding ascii

      - name: Upload verified Windows release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-release-candidate
          path: |
            dist/JameFirewall.exe
            dist/JameFirewall.exe.sha256
            artifacts/pytest-windows.xml
            artifacts/pytest-windows-system.xml
            artifacts/pester-windows.xml
          if-no-files-found: error

  release-please:
    name: Orchestrate Semantic Release
    needs:
      - quality-gate
      - windows-release-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Create scoped release GitHub App token
        id: release-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.JAMEFIREWALL_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.JAMEFIREWALL_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write
          permission-issues: write
          permission-pull-requests: write

      - name: Run Release-Please Engine
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.release-app-token.outputs.token }}

  publish-windows:
    name: Publish Verified Windows Asset
    needs:
      - windows-release-preflight
      - release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download verified Windows candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-release-candidate
          path: candidate

      - name: Verify candidate identity and stage canonical assets
        env:
          EXPECTED_SHA256: ${{ needs.windows-release-preflight.outputs.candidate_sha256 }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SHA256"
          test -n "$RELEASE_VERSION"
          test -n "$RELEASE_TAG"

          python3 scripts/stage_release_assets.py \
            --candidate-root candidate \
            --expected-sha256 "$EXPECTED_SHA256" \
            --release-version "$RELEASE_VERSION"

          CANONICAL_NAME="JameFirewall-v${RELEASE_VERSION}-windows-x64.exe"
          echo "CANONICAL_NAME=$CANONICAL_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Upload immutable assets to the created release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG"             "candidate/$CANONICAL_NAME"             "candidate/$CANONICAL_NAME.sha256"
