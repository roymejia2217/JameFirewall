[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jame-firewall"
version = "0.1.0"
description = "JameFirewall: Gestor profesional y unificado de reglas de Firewall de Windows para software y suites creativas."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Roy", email = "roy@local" }]
dependencies = [
    "ttkbootstrap>=1.20.1",
    "Pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pre-commit>=4.1.0",
    "pyinstaller>=6.11.0",
]

[project.scripts]
jame-firewall = "jame_firewall.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jame_firewall"]

# --- RUFF CONFIGURATION ---
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "RUF",    # Ruff-specific rules
    "S",      # flake8-bandit
]
ignore = [
    "S603",   # Subprocess call without shell=True
    "S607",   # Start process with partial executable path
    "E501",   # Line length handled by formatter
    "SIM112", # Environment variable capitalization
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- MYPY STRICT TYPE CHECKING ---
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "jame_firewall.presentation.*"
disallow_untyped_calls = false

# --- PYTEST CONFIGURATION ---
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: pruebas unitarias aisladas de dominio y utilidades",
    "contract: pruebas de cumplimiento de protocolos de interfaz",
    "integration: pruebas de integración con persistencia y OS simulado",
    "windows_only: pruebas que requieren Windows nativo para validación final",
]

[tool.coverage.run]
branch = true
source = ["src/jame_firewall"]
omit = [
    "src/jame_firewall/presentation/app.py",
    "src/jame_firewall/__main__.py",
]
